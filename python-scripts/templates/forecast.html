{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">🔮 Forecasted Stock Prices for {{ symbol }}</h1>

    <!-- Responsive Plotly Graph -->
    <div id="forecast-chart" style="height:600px;"></div>

    <!-- Forecasted Prices Table -->
    <div class="mt-5">
        <h3 class="text-center mb-3">Forecasted Future Prices</h3>
        <div class="table-responsive" style="max-height:400px; overflow-y:auto;">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Future Timestamp (UTC)</th>
                        <th>Predicted Price ($)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for ts, price in combined %}
                    <tr>
                        <td>{{ ts }}</td>
                        <td>{{ "%.2f"|format(price) }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Plotly.js -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<script>
// Plot the forecasted stock price chart
const forecastLabels = {{ labels|tojson }};
const forecastPrices = {{ prices|tojson }};

const trace = {
    x: forecastLabels,
    y: forecastPrices,
    mode: 'lines+markers',
    name: '{{ symbol }} Forecasted Price',
    line: { color: 'green', width: 3 },
    marker: { size: 4 }
};

const layout = {
    xaxis: {
        title: 'Date',
        showgrid: true,
        tickangle: -45
    },
    yaxis: {
        title: 'Predicted Price ($)',
        showgrid: true,
        zeroline: false
    },
    margin: { t: 30 },
    height: 600,
    plot_bgcolor: '#f8f9fa',
    paper_bgcolor: '#f8f9fa'
};

Plotly.newPlot('forecast-chart', [trace], layout, {responsive: true});
</script>
{% endblock %}
